name: macOS Installer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'platform/macos/**'
      - 'dds-node/**'
      - 'dds-core/**'
      - 'dds-domain/**'
      - 'dds-store/**'
      - 'dds-net/**'
      - 'dds-cli/**'
      - 'dds-fido2-test/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pkg.yml'
  pull_request:
    paths:
      - 'platform/macos/**'
      - 'dds-node/**'
      - 'dds-core/**'
      - 'dds-domain/**'
      - 'dds-store/**'
      - 'dds-net/**'
      - 'dds-cli/**'
      - 'dds-fido2-test/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pkg.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (leave empty to use VERSION file + run_number)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-pkg:
    name: macOS .pkg (${{ matrix.arch }})
    runs-on: macos-latest   # ARM64 runner; cross-compiles x86_64 target
    strategy:
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
            dotnet_rid: osx-arm64
          - arch: x86_64
            rust_target: x86_64-apple-darwin
            dotnet_rid: osx-x64

    steps:
      - uses: actions/checkout@v4

      # ── Compute version ──────────────────────────────────────────
      # Source of truth for the base version is the repo-root VERSION
      # file (e.g. "1.3.0"); push builds append github.run_number.
      # Tag pushes (v1.3.0.5) and workflow_dispatch with non-empty
      # version override take priority. Kept in sync with msi.yml and
      # linux.yml so a given commit produces matching version numbers
      # across the three artifact pipelines.
      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            v="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            v="${{ github.ref_name }}"
            v="${v#v}"  # strip leading 'v'
          else
            base=$(tr -d '[:space:]' < VERSION)
            v="${base}.${{ github.run_number }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Package version: $v"

      # ── Rust ─────────────────────────────────────────────────────
      # macos-latest pre-stages rustup-init at ~/.cargo/bin/cargo (the
      # binary literally identifies itself as `rustup-init 1.29.0`),
      # and dtolnay/rust-toolchain@stable does not always replace it
      # — so plain `cargo build` dies with
      #   "error: unexpected argument 'build' / Usage: rustup-init".
      # Force a clean rustup install before rust-cache restores
      # ~/.cargo/registry on top.
      - name: Bootstrap rust toolchain (clean rustup install)
        run: |
          rm -rf "$HOME/.cargo" "$HOME/.rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
            -y --default-toolchain stable --profile minimal \
            --target ${{ matrix.rust_target }}
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-pkg-${{ matrix.arch }}

      - name: Build Rust binaries (release)
        run: |
          which cargo
          cargo --version
          cargo build --release \
            -p dds-node --features fido2 \
            -p dds-cli \
            -p dds-fido2-test

      # ── .NET ─────────────────────────────────────────────────────
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish DdsPolicyAgent (self-contained)
        run: |
          dotnet publish \
            platform/macos/DdsPolicyAgent/DdsPolicyAgent.MacOS.csproj \
            -c Release \
            -r "${{ matrix.dotnet_rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -p:UseAppHost=true \
            -o platform/macos/packaging/build/agent

      # ── .NET tests ───────────────────────────────────────────────
      - name: Run macOS policy agent tests
        run: |
          dotnet test \
            platform/macos/DdsPolicyAgent.Tests/DdsPolicyAgent.MacOS.Tests.csproj \
            --verbosity minimal

      # ── Assemble payload + build .pkg ─────────────────────────────
      - name: Build .pkg
        working-directory: platform/macos/packaging
        run: |
          make pkg \
            BUILD_MODE=release \
            VERSION="${{ steps.version.outputs.version }}" \
            ARCH="${{ matrix.arch }}"

      - name: Verify .pkg contents
        run: |
          PKG="platform/macos/packaging/build/DDS-Platform-macOS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.pkg"
          echo "=== Package ==="
          ls -lh "$PKG"
          echo ""
          echo "=== Payload files ==="
          pkgutil --payload-files "$PKG" | grep -v '^\._'

      # ── Upload artifact ──────────────────────────────────────────
      - name: Upload .pkg
        uses: actions/upload-artifact@v4
        with:
          name: DDS-macOS-${{ matrix.arch }}
          path: platform/macos/packaging/build/*.pkg
          if-no-files-found: error

  # ── Collect SLSA hashes (all arches) ────────────────────────────
  # supply-chain-plan.md Phase C.1 — download every .pkg artifact from
  # both matrix legs, compute their SHA-256 digests, and emit the
  # base64-encoded subjects consumed by the provenance job below.
  collect-hashes:
    name: Collect artifact hashes
    needs: [build-pkg]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all .pkg artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DDS-macOS-*
          merge-multiple: true

      - name: Compute SHA-256 hashes
        id: hash
        run: |
          echo "hashes=$(sha256sum artifacts/*.pkg | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "SLSA subjects:"
          sha256sum artifacts/*.pkg

  # ── SLSA Level 3 provenance ──────────────────────────────────────
  # supply-chain-plan.md Phase C.1 — generate an in-toto SLSA Level 3
  # provenance attestation for all .pkg artifacts.
  provenance:
    needs: [collect-hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.collect-hashes.outputs.hashes }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # ── Smoke test (ARM64 only) ──────────────────────────────────────
  smoke-test:
    name: macOS smoke test
    needs: build-pkg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # See build-pkg for the macos-latest rustup-init shim rationale.
      - name: Bootstrap rust toolchain (clean rustup install)
        run: |
          rm -rf "$HOME/.cargo" "$HOME/.rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
            -y --default-toolchain stable --profile minimal \
            --target aarch64-apple-darwin
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-arm64

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build binaries (debug, for speed)
        run: |
          which cargo
          cargo --version
          cargo build -p dds-node --bin dds-node --bin dds-macos-e2e
          dotnet build platform/macos/DdsPolicyAgent/DdsPolicyAgent.MacOS.csproj -c Debug

      - name: Run smoke test
        run: platform/macos/e2e/smoke-test.sh

  # ── Sigstore cosign signing (tags only) ──────────────────────────
  # supply-chain-plan.md Phase C.5 — keyless cosign sign-blob using
  # GitHub Actions OIDC as the Fulcio identity.  Each .pkg gets a
  # <name>.bundle file (certificate + signature + Rekor tlog entry).
  #
  # Operators can verify any released .pkg with:
  #   cosign verify-blob \
  #     --bundle DDS-Platform-macOS-1.0.0-arm64.pkg.bundle \
  #     --certificate-identity-regexp \
  #       "https://github.com/.*/\.github/workflows/pkg\.yml@.*" \
  #     --certificate-oidc-issuer \
  #       "https://token.actions.githubusercontent.com" \
  #     DDS-Platform-macOS-1.0.0-arm64.pkg
  sign:
    name: Sign with cosign
    needs: [build-pkg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for keyless OIDC Fulcio signing
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all .pkg artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DDS-macOS-*
          merge-multiple: true

      - name: Sign .pkg artifacts
        working-directory: artifacts
        run: |
          for f in *.pkg; do
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
            echo "Signed: $f  →  ${f}.bundle"
          done

      - name: Upload signature bundles
        uses: actions/upload-artifact@v4
        with:
          name: cosign-bundles-pkg
          path: artifacts/*.bundle
          if-no-files-found: error

  # ── Release job (only on tags) ─────────────────────────────────
  release:
    name: Create Release
    needs: [build-pkg, smoke-test, provenance, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all .pkg artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DDS-macOS-*
          merge-multiple: true

      - name: Download provenance attestations
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*.intoto.jsonl"
          merge-multiple: true

      - name: Download cosign bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cosign-bundles-pkg
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.pkg
            artifacts/*.intoto.jsonl
            artifacts/*.bundle
          generate_release_notes: true
          draft: true

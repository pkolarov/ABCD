name: MSI Installer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'platform/windows/**'
      - 'dds-node/**'
      - 'dds-core/**'
      - 'dds-domain/**'
      - 'dds-store/**'
      - 'dds-net/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'VERSION'
      - '.github/workflows/msi.yml'
  pull_request:
    paths:
      - 'platform/windows/**'
      - 'dds-node/**'
      - 'dds-core/**'
      - 'dds-domain/**'
      - 'dds-store/**'
      - 'dds-net/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'VERSION'
      - '.github/workflows/msi.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'MSI version override (leave empty to use VERSION file + run_number)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-msi:
    name: MSI (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # ARM64 runs on the windows-11-arm hosted runner (GA 2025). That
    # runner has been flaky enough in the past to block the downstream
    # collect-hashes/provenance/sign/release pipeline — the previous
    # mitigation was to drop ARM64 from the matrix entirely (011dbe6).
    # Instead, continue-on-error is driven by matrix.optional so the
    # ARM64 leg can fail without failing the parent job: downstream
    # `needs: [build-msi]` then treats the parent as success and ships
    # whatever artifacts the x64 leg produced. ARM64 ships when its
    # runner is healthy, no-ops when it isn't. The x64 leg stays
    # required (optional: false).
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            msbuild_platform: x64
            dotnet_rid: win-x64
            native_build_dir: platform\windows\native\build\Release
            optional: false
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            msbuild_platform: ARM64
            dotnet_rid: win-arm64
            native_build_dir: platform\windows\native\build\Release-ARM64
            optional: true
    steps:
      - uses: actions/checkout@v4

      # ── Compute version ──────────────────────────────────────────
      # Source of truth for the base version is the repo-root VERSION
      # file (e.g. "1.3.0"). Push builds append github.run_number to
      # get a 4-part installer version (e.g. 1.3.0.487) that is always
      # forward-progressing and installable as an MSI MajorUpgrade.
      # Tag pushes (v1.3.0.5) win over VERSION so explicit releases
      # are reproducible. workflow_dispatch with a non-empty version
      # override wins over both, for ad-hoc rebuilds at a chosen
      # version.
      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}" -ne "") {
            $v = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            # Strip leading 'v' from tag and pad to 4 parts: v1.1.8 -> 1.1.8.0, v1.1.8.5 -> 1.1.8.5
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            $parts = $tag -split '\.'
            while ($parts.Count -lt 4) { $parts += '0' }
            $v = $parts[0..3] -join '.'
          } else {
            $base = (Get-Content VERSION -Raw).Trim()
            $v = "$base.${{ github.run_number }}"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "MSI Version: $v"

      # ── Rust ─────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msi-${{ matrix.arch }}

      # The windows-11-arm hosted runner image ships only the x64-host
      # cross toolchain (Hostx64\arm64\link.exe). rustc detects an ARM64
      # host triple and asks for Hostarm64\arm64\link.exe, which isn't
      # present — every cargo build fails with "linker not found" inside
      # a build script (proc-macro2, quote, …) before any project code
      # compiles. Install the native ARM64 toolset so rustc gets its
      # expected linker. Scoped to the arm64 leg so the x64 leg's
      # `windows-latest` doesn't pay the 3-5 min install for nothing.
      - name: Install ARM64 MSVC toolset (windows-11-arm)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          # Runner image has multiple VS installs (Enterprise + a
          # BuildTools dir that vswhere can't always see). cc-rs and
          # rustc each run their own vswhere queries and may disagree
          # on which install is "latest" — see runs 25962091028 and
          # 25962147843. Strategy: install Hostarm64 into whichever
          # install vswhere -latest returns (we know that works), then
          # tell rustc the exact linker path via GITHUB_ENV so it
          # doesn't fall back to its own (broken) lookup.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $installPath) { throw "vswhere returned no installPath" }
          Write-Host "VS install path: $installPath"

          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          & $vsInstaller modify `
            --installPath $installPath `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --quiet --norestart --wait --nocache
          # 0 = success, 3010 = success-reboot-required; treat both as OK
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "vs_installer modify failed (exit $LASTEXITCODE)"
          }

          # Sanity-check the Hostarm64 linker now exists. MSVC version
          # dir name floats (e.g. 14.44.35207) so resolve the latest.
          $msvcRoot = Join-Path $installPath 'VC\Tools\MSVC'
          $latest = (Get-ChildItem $msvcRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $linker = Join-Path $latest 'bin\Hostarm64\arm64\link.exe'
          if (-not (Test-Path $linker)) {
            throw "Hostarm64 linker still missing after install: $linker"
          }
          Write-Host "OK: $linker"

          # Override rustc's linker discovery for the ARM64 target. Without
          # this, rustc constructs a Hostarm64 path under a BuildTools dir
          # that vswhere-installed components never reach, and the build
          # dies with "linker not found" inside the first build script.
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker" | `
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Exported CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker"

      - name: Build dds-node + dds CLI (${{ matrix.rust_target }})
        run: cargo build --package dds-node --package dds-cli --target ${{ matrix.rust_target }} --release

      # ── C++ native ──────────────────────────────────────────────
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build C++ native (${{ matrix.msbuild_platform }})
        run: >
          msbuild platform\windows\native\DdsNative.sln
          /p:Configuration=Release
          /p:Platform=${{ matrix.msbuild_platform }}
          /m
          /verbosity:minimal

      # ── .NET ─────────────────────────────────────────────────────
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish DdsPolicyAgent (${{ matrix.dotnet_rid }})
        run: >
          dotnet publish platform\windows\DdsPolicyAgent\DdsPolicyAgent.csproj
          --configuration Release
          --runtime ${{ matrix.dotnet_rid }}
          --self-contained true
          --framework net9.0
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output stage\dotnet

      # ── Stage binaries ───────────────────────────────────────────
      - name: Stage binaries
        shell: pwsh
        run: |
          $stage = "stage\${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # Rust
          Copy-Item "target\${{ matrix.rust_target }}\release\dds-node.exe" $stage
          Copy-Item "target\${{ matrix.rust_target }}\release\dds.exe"      $stage

          # C++ native
          $nativeBuild = "${{ matrix.native_build_dir }}"
          @("DdsAuthBridge.exe", "DdsCredentialProvider.dll", "DdsTrayAgent.exe", "dds-enroll-user.exe") | ForEach-Object {
            $src = Join-Path $nativeBuild $_
            if (Test-Path $src) { Copy-Item $src $stage }
            else { throw "Native binary not found (did MSBuild run?): $src" }
          }

          # .NET
          Copy-Item "stage\dotnet\DdsPolicyAgent.exe" $stage

          # Installer-side PS1 scripts (mirrors Build-Msi.ps1 step 3.5)
          Get-ChildItem "platform\windows\installer\scripts" -Filter "*.ps1" | ForEach-Object {
            Copy-Item $_.FullName $stage -Force
          }

          Write-Host "Staged binaries:"
          Get-ChildItem $stage | Format-Table Name, Length

      # ── WiX MSI ──────────────────────────────────────────────────
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI (${{ matrix.arch }})
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $msiName = "DDS-${{ steps.version.outputs.version }}-${{ matrix.arch }}.msi"
          wix build platform\windows\installer\DdsBundle.wxs `
            -o "out\$msiName" `
            -d BuildDir="stage\${{ matrix.arch }}" `
            -d ConfigDir="platform\windows\installer\config" `
            -d Platform="${{ matrix.arch }}" `
            -d Version="${{ steps.version.outputs.version }}" `
            -arch ${{ matrix.arch }}
          Write-Host "Built: out\$msiName"
          Get-ChildItem out\*.msi | Format-Table Name, @{N='Size (MB)';E={[math]::Round($_.Length/1MB,1)}}

      # ── Authenticode signing (when certificate is available) ──────
      - name: Sign binaries (Authenticode)
        if: env.SIGN_CERT != ''
        shell: pwsh
        env:
          SIGN_CERT: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
          SIGN_TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          # Decode the PFX certificate from base64
          $certPath = [System.IO.Path]::GetTempFileName() + ".pfx"
          [System.Convert]::FromBase64String($env:SIGN_CERT) | Set-Content $certPath -AsByteStream

          # Sign each binary and the MSI
          $filesToSign = @(
            "stage\${{ matrix.arch }}\dds-node.exe",
            "stage\${{ matrix.arch }}\DdsAuthBridge.exe",
            "stage\${{ matrix.arch }}\DdsCredentialProvider.dll",
            "stage\${{ matrix.arch }}\DdsPolicyAgent.exe",
            "stage\${{ matrix.arch }}\DdsTrayAgent.exe",
            "stage\${{ matrix.arch }}\dds-enroll-user.exe"
          ) + @(Get-ChildItem "out\*.msi" | ForEach-Object { $_.FullName })

          foreach ($file in $filesToSign) {
            if (Test-Path $file) {
              & signtool sign /f $certPath /p $env:SIGN_CERT_PASSWORD `
                /tr $env:SIGN_TIMESTAMP_URL /td sha256 /fd sha256 `
                /d "DDS Windows Platform" $file
              Write-Host "Signed: $file"
            }
          }

          # Clean up
          Remove-Item $certPath -Force

      # ── Validate MSI ─────────────────────────────────────────────
      - name: Validate MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "out\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI found in out\" }

          # Basic size sanity check (MSI should be > 1 MB with all binaries)
          $sizeMB = [math]::Round($msi.Length / 1MB, 1)
          Write-Host "MSI size: $sizeMB MB"
          if ($msi.Length -lt 1MB) { throw "MSI suspiciously small: $sizeMB MB" }

          # Validate with wix
          wix msi validate $msi.FullName
          Write-Host "MSI validation passed"

      # ── SHA-256 checksums ────────────────────────────────────────
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $checksumFile = "out\SHA256SUMS-${{ matrix.arch }}.txt"
          Get-ChildItem "out\*.msi" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Tee-Object -Append -FilePath $checksumFile
          }
          Write-Host "Checksums:"
          Get-Content $checksumFile

      # ── Upload artifact ──────────────────────────────────────────
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: DDS-MSI-${{ matrix.arch }}
          path: |
            out/*.msi
            out/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error

  # ── Collect SLSA hashes (both arches) ────────────────────────────
  # supply-chain-plan.md Phase C.1 — download every MSI artifact from
  # both matrix legs, compute their SHA-256 digests, and emit the
  # base64-encoded subjects consumed by the provenance job below.
  # Uses the artifact-download pattern (mirrors pkg.yml) rather than
  # matrix job outputs, which historically misbehave across legs.
  collect-hashes:
    name: Collect MSI hashes
    needs: [build-msi]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all MSI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DDS-MSI-*
          merge-multiple: true

      - name: Compute SHA-256 hashes
        id: hash
        run: |
          echo "hashes=$(sha256sum artifacts/*.msi | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "SLSA subjects:"
          sha256sum artifacts/*.msi

  # ── SLSA Level 3 provenance ─────────────────────────────────────
  # supply-chain-plan.md Phase C.1 — generate an in-toto SLSA Level 3
  # provenance attestation for every MSI produced by build-msi.
  # The attestation is signed by GitHub's OIDC-backed Sigstore Fulcio
  # identity and uploaded as a workflow artifact and (on tags) as a
  # release asset alongside the MSI.
  #
  # Pin by commit SHA rather than semver tag for supply-chain safety;
  # update the SHA when bumping the generator version.
  provenance:
    needs: [collect-hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.collect-hashes.outputs.hashes }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # ── Sigstore cosign signing (tags only) ──────────────────────────
  # supply-chain-plan.md Phase C.5 — keyless cosign sign-blob using
  # GitHub Actions OIDC as the Fulcio identity.  Each MSI gets a
  # <name>.bundle file (certificate + signature + Rekor tlog entry).
  #
  # Operators can verify any released MSI with:
  #   cosign verify-blob \
  #     --bundle DDS-1.0.0.0-x64.msi.bundle \
  #     --certificate-identity-regexp \
  #       "https://github.com/.*/\.github/workflows/msi\.yml@.*" \
  #     --certificate-oidc-issuer \
  #       "https://token.actions.githubusercontent.com" \
  #     DDS-1.0.0.0-x64.msi
  sign:
    name: Sign with cosign
    needs: [build-msi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for keyless OIDC Fulcio signing
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download MSI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DDS-MSI-*
          merge-multiple: true

      - name: Sign MSI artifacts
        working-directory: artifacts
        run: |
          for f in *.msi; do
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
            echo "Signed: $f  →  ${f}.bundle"
          done

      - name: Upload signature bundles
        uses: actions/upload-artifact@v4
        with:
          name: cosign-bundles-msi
          path: artifacts/*.bundle
          if-no-files-found: error

  # ── Release job (only on tags) ─────────────────────────────────
  release:
    name: Create Release
    needs: [build-msi, provenance, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all MSI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DDS-MSI-*
          merge-multiple: true

      - name: Download provenance attestations
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*.intoto.jsonl"
          merge-multiple: true

      - name: Download cosign bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cosign-bundles-msi
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.msi
            artifacts/SHA256SUMS-*.txt
            artifacts/*.intoto.jsonl
            artifacts/*.bundle
          generate_release_notes: true
          draft: true

[package]
name = "dds-net"
description = "DDS networking layer — libp2p gossipsub, discovery, sync protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dds-core = { workspace = true }
dds-store = { workspace = true }
libp2p = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
# Bounded sync codec (transport.rs): same encoder libp2p's stock `cbor`
# request-response codec uses, so the wire stays byte-compatible.
cbor4ii = { version = "0.3", features = ["serde1", "use_std"] }
async-trait = "0.1"

[dev-dependencies]
rand = { workspace = true }
tracing-subscriber = "0.3"
